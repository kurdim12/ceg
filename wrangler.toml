name = "ceg"
main = "src/index.ts"
compatibility_date = "2025-09-06"

# Single cron trigger; the internal dispatcher routes hourly work
# (send dispatch every hour, sourcing at 23:00 UTC = 02:00 Amman).
[triggers]
crons = ["0 * * * *"]

[vars]
# Born safe: DRY_RUN is true in the very first commit and stays true
# until the Phase 6 Flip Gate passes with every box green.
DRY_RUN = "true"
PRODUCT_NAME = "Maranasi Engine"

[assets]
directory = "public"
binding = "ASSETS"

# Real resources, provisioned 2026-07-04 on the maintainer's account.
# All four migrations are already applied and recorded in d1_migrations.
[[d1_databases]]
binding = "DB"
database_name = "maranasi-engine"
database_id = "ee6688e2-7188-419f-8ba7-b319bac32479"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "KV"
id = "05ebc4ec38164d07a46323c8ff692782"

[[r2_buckets]]
binding = "R2"
bucket_name = "maranasi-engine"
