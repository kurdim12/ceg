name: CI
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (TypeScript strict)
        run: npm run typecheck
      - name: Tests
        run: npm run test
      - name: Zero native dialogs
        run: npm run check:dialogs
      - name: No geography hardcoding
        run: npm run check:geo
      - name: Worker builds
        run: npx wrangler deploy --dry-run
